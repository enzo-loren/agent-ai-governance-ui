name: Import Morris and Opazo brand assets (one-shot)
on:
  push:
    branches:
      - feat/morris-opazo-branding
permissions:
  contents: write
jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download pinned brand assets and verify Git blob identity
        run: |
          set -euo pipefail
          mkdir -p assets/branding
          root="https://raw.githubusercontent.com/christophernavarro/Governance-AI/506ae122032c0f98d250287b5d25374dde07dab2"
          curl --fail --location --retry 3 "$root/static/images/cropped-mo-icon.png" -o assets/branding/morris-mark.png
          curl --fail --location --retry 3 "$root/static/images/logo-morrisopazo.png" -o assets/branding/morris-wordmark.png
          test "$(git hash-object assets/branding/morris-mark.png)" = "ca79f15ffa300a8884e876b86e4e767bde0b874b"
          test "$(git hash-object assets/branding/morris-wordmark.png)" = "e3d96b14b0a1a4ad1fe1bae881da15861dac65c3"
          rm .github/workflows/import-morris-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/branding/morris-mark.png assets/branding/morris-wordmark.png .github/workflows/import-morris-assets.yml
          git commit -m "assets(branding): vendor original Morris & Opazo PNGs"
          git push origin "HEAD:feat/morris-opazo-branding"
