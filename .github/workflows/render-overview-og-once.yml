name: Render Overview Open Graph image (temporary)
on:
  push:
    branches: [feat/overview-link-preview]
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium rendering runtime
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Generate and commit real Overview social card
        run: |
          set -euo pipefail
          python scripts/render_social_preview.py
          rm .github/workflows/render-overview-og-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/social/overview-og.png .github/workflows/render-overview-og-once.yml
          git commit -m "assets(social): include rendered Overview Open Graph preview"
          git push origin HEAD:feat/overview-link-preview
